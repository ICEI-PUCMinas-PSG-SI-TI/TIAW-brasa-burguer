<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escolha seu Pedido - Brasa Burger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff3e0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h2 {
      color: #d84315;
      margin-bottom: 20px;
    }

    form {
      text-align: left;
    }

    /* Opções estilo flex para hambúrguer, bebida e acompanhamento */
    .option {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .option:hover {
      background-color: #fff3e0;
    }

    .option input[type="radio"] {
      margin-right: 10px;
      transform: scale(1.3);
      flex-shrink: 0;
    }

    .img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .option-text {
      flex-grow: 1;
      text-align: left;
      color: #333;
    }

    .price {
      font-weight: bold;
      color: #d84315;
      min-width: 50px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Container para grupo de opções */
    .group-title {
      font-weight: bold;
      margin-top: 25px;
      margin-bottom: 10px;
      font-size: 18px;
      color: #d84315;
      text-align: left;
    }

    .btn {
      width: 100%;
      background-color: #d84315;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:hover {
      background-color: #bf360c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Escolha seu Pedido</h2>
    <form id="pedidoForm">
      <!-- Hambúrgueres -->
      <div class="group-title">Hambúrgueres</div>
      <label class="option">
        <input type="radio" name="burger" value="Cheeseburguer" data-price="20" required />
        <img src="../images/cheeseburguer.png" alt="Cheeseburguer" class="img" />
        <div class="option-text">
          Cheeseburguer - Pão de brioche, burger bovino 100g, queijo prato, picles e alface
        </div>
        <div class="price">R$ 20</div>
      </label>

      <label class="option">
        <input type="radio" name="burger" value="Cheddar Bacon Burguer" data-price="25" />
        <img src="../images/cheddar.png" alt="Cheddar Bacon Burguer" class="img" />
        <div class="option-text">
          Cheddar Bacon Burguer - Pão de brioche, burger bovino 100g, queijo cheddar derretido, bacon, cebola caramelizada, alface e tomate
        </div>
        <div class="price">R$ 25</div>
      </label>

      <label class="option">
        <input type="radio" name="burger" value="Cheese Salada" data-price="25" />
        <img src="../images/salad.png" alt="Cheese Salada" class="img" />
        <div class="option-text">
          Cheese Salada - Pão de brioche, burger bovino 100g, queijo prato, alface, tomate, maionese temperada
        </div>
        <div class="price">R$ 25</div>
      </label>

      <!-- Bebidas -->
      <div class="group-title">Bebidas</div>
      <label class="option">
        <input type="radio" name="drink" value="Coca-Cola" data-price="6" required />
        <img src="../images/coca.png" alt="Coca-Cola" class="img" />
        <div class="option-text">Coca-Cola</div>
        <div class="price">R$ 6</div>
      </label>

      <label class="option">
        <input type="radio" name="drink" value="Guaraná" data-price="6" />
        <img src="../images/guarana.png" alt="Guaraná" class="img" />
        <div class="option-text">Guaraná</div>
        <div class="price">R$ 6</div>
      </label>

      <label class="option">
        <input type="radio" name="drink" value="Suco de Uva" data-price="6" />
        <img src="../images/suco.png" alt="Suco de Uva" class="img" />
        <div class="option-text">Suco de Uva</div>
        <div class="price">R$ 6</div>
      </label>

      <label class="option">
        <input type="radio" name="drink" value="Água" data-price="5" />
        <img src="../images/agua.png" alt="Água" class="img" />
        <div class="option-text">Água</div>
        <div class="price">R$ 5</div>
      </label>

      <label class="option">
        <input type="radio" name="drink" value="Não quero bebida" data-price="0" />
        <div class="option-text">Não quero bebida</div>
        <div class="price">R$ 0</div>
      </label>

      <!-- Acompanhamentos -->
      <div class="group-title">Acompanhamentos</div>
      <label class="option">
        <input type="radio" name="side" value="Fritas" data-price="10" />
        <img src="../images/fritas.png" alt="Fritas" class="img" />
        <div class="option-text">Fritas</div>
        <div class="price">R$ 10</div>
      </label>

      <label class="option">
        <input type="radio" name="side" value="Não quero acompanhamento" data-price="0" />
        <div class="option-text">Não quero acompanhamento</div>
        <div class="price">R$ 0</div>
      </label>

      <button type="submit" class="btn">Confirmar Pedido</button>
    </form>
  </div>

  <script>
    document.getElementById('pedidoForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const burger = document.querySelector('input[name="burger"]:checked');
      const drink = document.querySelector('input[name="drink"]:checked');
      const side = document.querySelector('input[name="side"]:checked');

      if (!burger) {
        alert('Por favor, escolha um hambúrguer.');
        return;
      }
      if (!drink) {
        alert('Por favor, escolha uma bebida.');
        return;
      }
      if (!side) {
        alert('Por favor, escolha um acompanhamento.');
        return;
      }

      const burgerPrice = Number(burger.dataset.price);
      const drinkPrice = Number(drink.dataset.price);
      const sidePrice = Number(side.dataset.price);

      const total = burgerPrice + drinkPrice + sidePrice;

      const pedido = {
        burger: burger.value,
        burgerPrice,
        drink: drink.value,
        drinkPrice,
        side: side.value,
        sidePrice,
        total
      };

      localStorage.setItem('pedido', JSON.stringify(pedido));

      window.location.href = 'resumo.html';
    });
  </script>
</body>
</html>
