<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrega - Brasa Burger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff3e0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #d84315;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: #d84315;
      color: white;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #bf360c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Endereço de Entrega</h2>
    <form id="entregaForm">
      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" required>

      <label for="rua">Rua</label>
      <input type="text" id="rua" name="rua" required>

      <label for="numero">Número</label>
      <input type="text" id="numero" name="numero" required>

      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" name="complemento">

      <label for="bairro">Bairro</label>
      <input type="text" id="bairro" name="bairro" required>

      <button type="submit">Confirmar Endereço</button>
    </form>
  </div>

  <script>
    document.getElementById('entregaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Pega dados do formulário
      const endereco = {
        cep: document.getElementById('cep').value,
        rua: document.getElementById('rua').value,
        numero: document.getElementById('numero').value,
        complemento: document.getElementById('complemento').value,
        bairro: document.getElementById('bairro').value,
      };

      // Recupera pedido do localStorage
      const pedido = JSON.parse(localStorage.getItem('pedido')) || {};

      // Salva o endereço dentro do pedido
      pedido.endereco = endereco;

      // Atualiza localStorage
      localStorage.setItem('pedido', JSON.stringify(pedido));

      // Redireciona para a página de pagamento
      window.location.href = 'pagamento.html';
    });
  </script>
</body>
</html>
