<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento - Brasa Burger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff3e0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 30px;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #d84315;
      margin-bottom: 20px;
    }

    .resumo {
      background: #fff3e0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #333;
      line-height: 1.4;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: #d84315;
      color: white;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #bf360c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Pagamento - Brasa Burger</h2>

    <div class="resumo" id="resumoPedido">
      <!-- Resumo do pedido e endereço será inserido aqui -->
    </div>

    <form id="pagamentoForm">
      <label for="nome">Nome do Titular (conforme cartão)</label>
      <input type="text" id="nome" name="nome" required>

      <label for="numero">Número do Cartão</label>
      <input type="text" id="numero" name="numero" maxlength="19" placeholder="**** **** **** ****" required>

      <label for="validade">Data de Validade</label>
      <input type="month" id="validade" name="validade" required>

      <label for="codigo">Código de Segurança</label>
      <input type="text" id="codigo" name="codigo" maxlength="4" required>

      <label for="cpf">CPF do Titular</label>
      <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>

      <button type="submit">Finalizar Pagamento</button>
    </form>
  </div>

  <script>
    // Recupera pedido do localStorage
    const pedido = JSON.parse(localStorage.getItem('pedido'));

    if (!pedido) {
      alert('Nenhum pedido encontrado. Redirecionando para seleção.');
      window.location.href = 'selecao.html';
    } else {
      const endereco = pedido.endereco || {};
      const total = (pedido.burgerPrice || 0) + (pedido.drinkPrice || 0) + (pedido.sidePrice || 0);

      // Monta o resumo detalhado
      const resumoHtml = `
        <strong>Hambúrguer:</strong> ${pedido.burger} (R$ ${pedido.burgerPrice.toFixed(2)})<br>
        <strong>Bebida:</strong> ${pedido.drink} (R$ ${pedido.drinkPrice.toFixed(2)})<br>
        <strong>Acompanhamento:</strong> ${pedido.side} (R$ ${pedido.sidePrice.toFixed(2)})<br>
        <strong>Total:</strong> R$ ${total.toFixed(2)}<br><br>
        <strong>Endereço de Entrega:</strong><br>
        ${endereco.rua}, ${endereco.numero} ${endereco.complemento || ''} <br>
        Bairro: ${endereco.bairro} <br>
        CEP: ${endereco.cep}
      `;

      document.getElementById('resumoPedido').innerHTML = resumoHtml;
    }

    document.getElementById('pagamentoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Pagamento finalizado! Obrigado por escolher o Brasa Burger 🍔');
      localStorage.removeItem('pedido');
      window.location.href = 'index.html'; // ou página de agradecimento
    });
  </script>
</body>
</html>
